# Builds ./web (Next.js static export) and deploys it to GitHub Pages on
# every push to master. The hand-written ./site is no longer published.
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: it installs exactly what package-lock.json pins, so a
      # deploy can never pick up a different dependency version than the one
      # the build was tested against.
      - name: Install
        run: npm ci
        working-directory: web

      # next.config.mjs sets output:"export", so this writes plain HTML to
      # web/out — no Node server involved, which is all Pages can host.
      - name: Build
        run: npm run build
        working-directory: web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
